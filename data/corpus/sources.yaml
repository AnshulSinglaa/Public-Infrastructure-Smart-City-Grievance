# Official document sources for the citation corpus (HLD-S6 §3.1, contract §2.2).
# Official sources only: tier 1 = the issuing body's own text, tier 2 = government news / Parliament
# answers. Private news is never listed (the 10 news-only rules show "No official document found").
# key: stable id (never rename) · layer: national | state | delhi · state_code: state_directory.csv code
# level: central | state | local = who the issuing body is (FIX-PLAN-S6 B)
# covers: issue types / matters it applies to ("all" = any) · not_for: matters it must NOT be offered for
# superseded_note: the body named no longer exists in that form (shown with the answer, B-071)
# manual: true = the site blocks automated download; save the file from a browser as
#         data/corpus/manual/<key>.pdf (git-ignored) and the ingest uses it with this url (B-061)
# issued_on: null = "date not stated" · rules: rule_ids in rules_draft.csv this source backs

