<!doctype html>
<!-- Cloudflare Turnstile as a tiny Streamlit component (no build step, no npm).
     Streamlit talks to a component iframe with postMessage: we say "ready", it sends
     "render" with our args (the site key), and we send back the widget's token. -->
<html>
<body style="margin:0; background:transparent">
<div id="widget"></div>
<script>
  const send = (type, data) =>
    window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
  const setValue = (value) => send("streamlit:setComponentValue", { value, dataType: "json" });
  let started = false;
  window.addEventListener("message", (event) => {
    if (event.data.type !== "streamlit:render" || started) return;
    started = true;
    window.onTurnstileLoad = () => turnstile.render("#widget", {
      sitekey: event.data.args.sitekey,
      theme: "dark",
      callback: setValue,                       // a fresh one-time token
      "expired-callback": () => setValue(null), // tokens last 5 minutes
      "error-callback": () => setValue(null),
    });
    const script = document.createElement("script");
    script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit";
    document.head.appendChild(script);
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 72 });
</script>
</body>
</html>
