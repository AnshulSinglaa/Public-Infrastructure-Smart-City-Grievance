# Colours from docs/UX.md §13 (dark theme).
[theme]
base = "dark"
primaryColor = "#5B9CF5"
backgroundColor = "#262624"
secondaryBackgroundColor = "#30302E"
textColor = "#ECEAE4"
borderColor = "#3E3E3A"
linkColor = "#5B9CF5"
baseRadius = "12px"
buttonRadius = "10px"
# Inter (UX §14; loaded by the @import in style.css). Hindi text the user types falls back
# to the system Devanagari font. Set here, not in CSS, so the icon font is left alone.
font = "Inter, sans-serif"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#1F1E1D"

[client]
toolbarMode = "minimal"
# "none": no message, type or traceback (B-030). In Streamlit 1.66 the old `false` means
# "stacktrace", which still showed local paths. Options: full | stacktrace | type | none.
showErrorDetails = "none"

[server]
address = "127.0.0.1"  # local only: not reachable from the network (B-025)
maxUploadSize = 5  # MB; matches the API's 5 MB photo limit (whole MB only)
