version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # skip brand-new releases (malicious-upload window)
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directories: [/infra/db, /infra/ingest]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
