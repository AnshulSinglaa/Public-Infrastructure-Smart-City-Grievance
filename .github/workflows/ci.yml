name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:dev@127.0.0.1:5433/civic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Same compose file as local, so CI gets PostGIS + Qdrant with no extra setup.
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait db qdrant
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync
      # Fail the build if any locked dependency has a known vulnerability.
      - run: |
          uv export --no-hashes --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit@2.10.1 -r requirements.txt --no-deps --disable-pip
      - run: uv run ruff check .
      # Fresh CI database: create the tables before the tests use them.
      - run: uv run alembic upgrade head
      # Routing tests need the ward maps (data/wards.geojson + special_zones), same as local setup.
      - run: uv run python scripts/load_wards.py
      - run: uv run pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
