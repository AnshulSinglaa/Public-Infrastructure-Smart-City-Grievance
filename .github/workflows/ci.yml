name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:dev@127.0.0.1:5433/civic
    steps:
      - uses: actions/checkout@v4
      # Same compose file as local, so CI gets PostGIS + Qdrant with no extra setup.
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait db qdrant
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      # Fresh CI database: create the tables before the tests use them.
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
