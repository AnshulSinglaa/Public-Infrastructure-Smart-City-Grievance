name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # pytest only ever uses <name>_test (backend/tests/conftest.py), so load that one.
      DATABASE_URL: postgresql://postgres:dev@127.0.0.1:5433/civic_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Same compose file as local, so CI gets PostGIS + Qdrant with no extra setup.
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait db qdrant
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync
      # Fail the build if any locked dependency has a known vulnerability.
      - run: |
          uv export --no-hashes --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit@2.10.1 -r requirements.txt --no-deps --disable-pip
      - run: uv run ruff check .
      # Fresh CI database: tables + wards, zones, rules, OSM roads and state outlines, all from
      # committed files in data/ (data/raw is not needed), so the real-road routing tests run.
      # The same command loads Supabase (docs/DEPLOY.md).
      - run: uv run python scripts/load_all.py
      # Every migration must also undo cleanly (O-03), then the data goes back in.
      - run: |
          uv run alembic downgrade base
          uv run python scripts/load_all.py
      - run: uv run pytest -q

  # Q&A eval in replay mode (PLAN §10.5): no DB, no network, no keys. Scores the newest
  # committed recording in eval/recordings/ against the §10.4 targets (eval/README.md).
  eval-replay:
    runs-on: ubuntu-latest
    # Not blocking until the first passing live recording is committed; then remove this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      # The eval has its own uv project (eval/pyproject.toml): ragas / deepeval stay out of the app's lock.
      - run: uv sync --project eval
      - run: uv run --project eval pytest eval -q -p no:cacheprovider --rootdir eval -o pythonpath=eval -o testpaths=eval
      - run: uv run --project eval python eval/run_eval.py replay --check
      - if: always()
        run: cat eval/report.md >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
