name: Backup
# Daily pg_dump of the app's tables, encrypted BEFORE upload to an offline public key
# (SEC-017). This repo is public, so anyone signed in to GitHub can download the artifact:
# only the private key, kept on the owner's own machine, can open it. GitHub holds just the
# public key, so even a leaked secret can't decrypt a backup. Restore: docs/DEPLOY.md.
on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
    steps:
      - name: Fail if a secret is missing
        if: env.DATABASE_URL == '' || env.BACKUP_PUBLIC_KEY == ''
        run: |
          echo "::error::Set the DATABASE_URL and BACKUP_PUBLIC_KEY secrets (docs/DEPLOY.md)."
          exit 1
      # Only the public schema (our tables): Supabase's auth schema (emails) is never dumped.
      # pg_dump 17 in a pinned container, so it matches Supabase's Postgres 17.
      - name: Dump and encrypt
        run: |
          set -euo pipefail
          printf '%s\n' "$BACKUP_PUBLIC_KEY" > backup-public.asc
          docker run --rm -e DATABASE_URL \
            postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b \
            sh -c 'pg_dump --schema=public --no-owner --no-privileges --format=custom "$DATABASE_URL"' \
            | gpg --batch --yes --trust-model always --encrypt \
                  --recipient-file backup-public.asc --output backup.dump.gpg
          test -s backup.dump.gpg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: db-backup-${{ github.run_number }}
          path: backup.dump.gpg
          retention-days: 7
          if-no-files-found: error
