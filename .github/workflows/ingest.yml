name: Corpus ingest
# Fetch official documents from data/corpus/sources.yaml, chunk, embed (Gemini + BM25) and write
# them to Postgres + Qdrant (HLD-S6 §3). Monthly, or by hand for one source or all.
# Secrets: INGEST_DATABASE_URL, QDRANT_URL, QDRANT_API_KEY, GOOGLE_API_KEY.
on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      only:
        description: "One source key (empty = every due source)"
        required: false
      all:
        description: "Re-check every source, even if checked recently"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ONLY: ${{ inputs.only }}
      ALL: ${{ inputs.all }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      # Fail early and clearly when a secret is missing (an empty DATABASE_URL would fall back
      # to the 127.0.0.1 default and fail late with a confusing error).
      - run: |
          for v in DATABASE_URL QDRANT_URL QDRANT_API_KEY GOOGLE_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; exit 1; fi
          done
      - run: uv sync --no-dev
      # Inputs go through env vars, never straight into the shell line (script injection).
      - run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$ALL" = "true" ]; then args+=(--all); fi
          uv run python scripts/ingest_corpus.py "${args[@]}"
      # Raw copies of each fetched version (audit trail), kept 90 days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-raw
          path: .cache/corpus
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
